name: CI

on:
  pull_request:
  push:
    branches: [main, develop, 'sync/**']
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # openvpn3 is only needed for the native engine, which this job does not build.
      - name: Fetch UI and installer submodules
        run: git submodule update --init --depth 1 DataGateWin.UI DataGateWin.Installer

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test libXray release cache
        run: pwsh -File scripts/libxray/test-fetch-cache.ps1

      - name: Build WinUI app
        run: dotnet build DataGateWin.WinUI/DataGateWin.csproj -c Release -p:Platform=x64

      - name: Test
        run: dotnet test DataGateWin.Tests/DataGateWin.Tests.csproj -c Release --logger "console;verbosity=normal"
